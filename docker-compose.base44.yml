services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - BASE44_PREVIEW_MODE
    env_file:
      - /run/base44/app.env
    command: ["node", "server.js"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode===200?0:1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
